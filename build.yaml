image: "thumb.png"
version: "0.4.1.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Link tracks from sub folders, fix episode numbers of release names, organize releases"
description: >
  Three things for libraries filled straight from torrents. Link mode (automatic): audio and subtitle files
  stored in sub folders of a release ("RU Sound [Anilibria]", "RUS Subs/Crunchyroll/Надписи",
  "Sounds/Wakanim") show up as regular external tracks with language, studio title and signs flag; media
  folders are not touched. Episode recognition: release names Jellyfin misreads ([2023] in a folder name read
  as episode 2023, "[Grp]_Show_07_(..)", "Show_[61_of_62]", "Show TV-2 - 10") get correct numbers.
  Organize mode (on demand): pick a release, check the file-to-episode mapping, review the plan and rename
  folder, videos and every related file to one Sonarr-style scheme; every change is journaled and can be
  undone.
category: "Library"
owner: "hametovbr"
artifacts:
  - "Jellyfin.Plugin.OuterFiles.dll"
  - "Jellyfin.Plugin.OuterFiles.Domain.dll"
changelog: >
  0.4.1: a plan with two files on one episode is a conflict instead of a "(2)" copy; with title matching,
  untitled copies follow the titled copy that carries the same number.
