image: "thumb.png"
version: "0.1.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Attach audio and subtitle files from sub folders to their video"
description: >
  Jellyfin only picks up external audio and subtitle files that sit next to the video and start with the
  video file name. Release groups usually put extra tracks and subtitles into sibling folders
  ("RU Subs", "EN Sound", "RU Sound [Anilibria]/надписи") or into a sub folder of the video folder.
  This plugin walks the folder of every video, matches tracks to episodes (or a movie) by their numbers
  and common prefix, detects language, signs (forced) and studio from folder and file names, and links the
  tracks as regular external streams. Media files are never modified and no files are created.
category: "Library"
owner: "hametovbr"
artifacts:
  - "Jellyfin.Plugin.OuterFiles.dll"
changelog: >
  0.1.1: plugin settings are stored as scalars; the scan history moved to history.json, so the scheduled
  task and the settings page work. Added scan counters (inspected/changed/tracks/errors).
  0.1.0: initial release.