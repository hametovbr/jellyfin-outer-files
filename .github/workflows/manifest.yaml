name: '📋 Update manifest'

# Regenerates manifest.json from the plugin zip of a release, so the repository can be used as a
# Jellyfin plugin source and always points at the current binary with its checksum.
on:
  # Run after the Release workflow: it creates the release with GITHUB_TOKEN, and events produced by
  # GITHUB_TOKEN never start another workflow, so "on: release" silently never fires.
  workflow_run:
    workflows: ['📦 Release']
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v0.1.1)'
        required: false

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jprm
        run: pip install jprm==1.1.0

      - name: Build manifest entry for the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          mkdir -p tmp/repo tmp/zips
          echo '[]' > tmp/repo/manifest.json
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' -D tmp/zips --clobber
          ZIP=$(ls tmp/zips/*.zip | head -1)
          jprm repo add --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" tmp/repo "$ZIP"
          cp tmp/repo/manifest.json manifest.json

      - name: Commit manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if git diff --cached --quiet; then
            echo 'manifest unchanged'
            exit 0
          fi
          git commit -m "Update plugin manifest for $(git describe --tags --abbrev=0)"
          git push origin main
